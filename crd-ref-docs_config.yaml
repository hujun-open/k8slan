processor:
  maxDepth: 176
  ignoreGroupVersions:
    - "GVK"
  ignoreTypes:
    - "Embedded[2-4]$"
    - "AddRequest"
    - '\bK8sLANVethPluginConf\b'
    - '\bMACVTAPPluginConf\b'
    - '\bRoute\b'
  ignoreFields:
    - "status$"
    - "TypeMeta$"
  customMarkers:
    - name: "hidefromdoc"
      target: type

render:
  kubernetesVersion: 1.25
